<html lang="en">
<head>
  <meta charset="utf-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "Harry Body";
      src: url("Harry-Body.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Harry Headline";
      src: url("Harry-Headline.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg:            #F9F4F2;
      --ink:           #181910;
      --ink-soft:      rgba(24, 25, 16, 0.5);
      --ink-softer:    rgba(24, 25, 16, 0.08);
      --text-secondary:#5A5248;
      --accent:        #F2A33B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-image: radial-gradient(circle, var(--ink-softer) 1px, transparent 1.2px);
      background-size: 24px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .confirmation {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .confirmation h1 {
      font-family: "Harry Body", "Caveat", cursive;
      font-weight: 400;
      font-size: clamp(72px, 12vw, 168px);
      line-height: 0.82;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin: 0 0 32px;
    }
    .confirmation h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .confirmation p {
      font-family: "DM Sans", sans-serif;
      font-size: clamp(16px, 2.2vw, 20px);
      line-height: 1.55;
      color: var(--text-secondary);
      max-width: 520px;
      margin: 0 auto;
    }

    @media (max-width: 560px) {
      .confirmation h1 {
        font-size: clamp(60px, 18vw, 110px);
        line-height: 0.88;
      }
    }
  </style>
</head>
<body>

  <main class="confirmation">
    <h1>Thank <em>you</em>.</h1>
    <p>Please check your email, including your spam folder, for your confirmation email with all the details on how to access your purchase.</p>
  </main>

</body>
</html>
