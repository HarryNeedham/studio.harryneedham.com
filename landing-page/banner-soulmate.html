<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soulmate Studio — YouTube Banner</title>

  <link rel="stylesheet" href="https://use.typekit.net/gsy0lao.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #F9F4F2;
      --ink:       #181910;
      --ink-soft:  #4F4A42;
      --accent:    #F2A33B;
      --accent-strong: #E8952A;
      --icon:      #53524B;
      --frame-ink: rgba(24, 25, 16, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1672px;
      height: 941px;
      overflow: hidden;
      background: var(--bg);
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
    }

    .stage {
      position: relative;
      width: 1672px;
      height: 941px;
      overflow: hidden;
    }

    /* Atmospheric orange blobs */
    .blobs {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 900px 700px at 15% 20%, rgba(242,163,59,0.11), transparent 60%),
        radial-gradient(ellipse 750px 700px at 85% 80%, rgba(242,163,59,0.08), transparent 60%),
        radial-gradient(ellipse 500px 400px at 50% 50%, rgba(242,163,59,0.05), transparent 65%);
    }

    /* Dot grid */
    .dots {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, var(--icon) 1.2px, transparent 1.4px);
      background-size: 28px 28px;
      opacity: 0.14;
    }

    /* Architectural frame (pencil wobbly) */
    .frame {
      position: absolute;
      inset: 32px;
      border: 1.6px solid var(--frame-ink);
      filter: url(#pencil);
      pointer-events: none;
    }

    .corner-cross {
      position: absolute;
      width: 26px;
      height: 26px;
    }
    .corner-cross::before,
    .corner-cross::after {
      content: '';
      position: absolute;
      background: var(--frame-ink);
    }
    .corner-cross::before { left: 50%; top: 0;  width: 2.2px; height: 100%; transform: translateX(-50%); }
    .corner-cross::after  { top: 50%; left: 0; width: 100%;  height: 2.2px; transform: translateY(-50%); }
    .corner-cross.tl { top: -13px;    left: -13px;    }
    .corner-cross.tr { top: -13px;    right: -13px;   }
    .corner-cross.bl { bottom: -13px; left: -13px;    }
    .corner-cross.br { bottom: -13px; right: -13px;   }

    /* Main content container — 275px tall band (YouTube safe area), centered. */
    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 275px;
    }

    /* The oval-and-arrows diagram fills the 275px band exactly. */
    .diagram {
      position: absolute;
      inset: 0;
      filter: url(#pencil);
    }

    /* Oval text and tagline are DOM text (not inside the pencil filter)
       so they stay crisp. All positioned in the 1200×275 container. */
    .oval-text {
      position: absolute;
      left: 50%;
      top: 115px;
      transform: translate(-50%, -50%);
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: 50px;
      color: var(--ink);
      white-space: nowrap;
      z-index: 2;
      line-height: 1;
    }

    .tagline {
      position: absolute;
      left: 50%;
      top: 190px;
      transform: translateX(-50%);
      font-family: "Caveat", cursive;
      font-weight: 500;
      font-size: 30px;
      color: var(--accent);
      white-space: nowrap;
      z-index: 2;
      line-height: 1;
    }

    .arrow-label {
      position: absolute;
      font-family: "Caveat", cursive;
      font-weight: 600;
      font-size: 30px;
      color: var(--ink);
      line-height: 1.05;
      white-space: nowrap;
      z-index: 2;
    }

    /* 4 corner labels inside the 1200×275 container.
       Each label's inner corner sits right at its arrow tip:
         top-left tip  = (355,  78)  → label bottom-right corner
         top-right tip = (845,  78)  → label bottom-left corner
         bot-left tip  = (355, 175)  → label top-right corner
         bot-right tip = (845, 175)  → label top-left corner
       All lines right-align (left labels) or left-align (right labels)
       so every line ends/starts at the arrow tip, not just the longest. */
    .label-tl { top:  15px; right: 845px; text-align: right; }
    .label-tr { top:  15px; left:  845px; text-align: left; }
    .label-bl { top: 175px; right: 845px; text-align: right; }
    .label-br { top: 175px; left:  845px; text-align: left; }

    /* Signature mark bottom-right */
    .signature {
      position: absolute;
      right: 70px;
      bottom: 56px;
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: 28px;
      color: var(--ink);
      transform: rotate(-2deg);
      opacity: 0.75;
    }

    .signature .scribble {
      display: block;
      width: 140px;
      height: 8px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Pencil wobble filter -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
        <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6"/>
      </filter>
    </defs>
  </svg>

  <div class="stage">

    <div class="blobs"></div>
    <div class="dots"></div>

    <div class="center">

      <!-- Diagram: oval + 4 curved arrows, in one SVG (1200×275 container) -->
      <svg class="diagram" viewBox="0 0 1200 275" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 12 5 L 0 10 Z" fill="#F2A33B" />
          </marker>
        </defs>

        <!-- Scribbly oval - 3 overlapping ellipses in warm orange, centered at (600, 115) -->
        <ellipse cx="600" cy="115" rx="190" ry="38"
          fill="none" stroke="#F2A33B" stroke-width="4" stroke-linecap="round"
          opacity="0.95" />
        <ellipse cx="600" cy="115" rx="192" ry="36"
          fill="none" stroke="#F2A33B" stroke-width="2.8" stroke-linecap="round"
          opacity="0.75" transform="rotate(-1.2 600 115)" />
        <ellipse cx="600" cy="117" rx="188" ry="40"
          fill="none" stroke="#F2A33B" stroke-width="2.3" stroke-linecap="round"
          opacity="0.55" transform="rotate(1.5 600 117)" />

        <!-- 4 curved arrows from oval edge out to the 4 label corners.
             Shorter than before, with endpoints pulled toward the centre
             both horizontally AND vertically (top down, bottom up). -->
        <!-- Top-left: from oval (420, 95) curving up-left to (355, 78) -->
        <path d="M 420 95 Q 388 83, 355 78"
          fill="none" stroke="#F2A33B" stroke-width="3" stroke-linecap="round"
          marker-end="url(#arrowhead)" />

        <!-- Bottom-left: from oval (420, 135) curving down-left to (355, 175) -->
        <path d="M 420 135 Q 388 157, 355 175"
          fill="none" stroke="#F2A33B" stroke-width="3" stroke-linecap="round"
          marker-end="url(#arrowhead)" />

        <!-- Top-right: from oval (780, 95) curving up-right to (845, 78) -->
        <path d="M 780 95 Q 812 83, 845 78"
          fill="none" stroke="#F2A33B" stroke-width="3" stroke-linecap="round"
          marker-end="url(#arrowhead)" />

        <!-- Bottom-right: from oval (780, 135) curving down-right to (845, 175) -->
        <path d="M 780 135 Q 812 157, 845 175"
          fill="none" stroke="#F2A33B" stroke-width="3" stroke-linecap="round"
          marker-end="url(#arrowhead)" />
      </svg>

      <!-- Center oval label and tagline (DOM text, not filtered, so crisp) -->
      <div class="oval-text">Soulmate clients</div>
      <div class="tagline">I help you get more of them.</div>

      <!-- Four corner labels -->
      <div class="arrow-label label-tl">
        They buy<br/>
        the easiest.
      </div>
      <div class="arrow-label label-bl">
        Pay<br/>
        the most.
      </div>
      <div class="arrow-label label-tr">
        Get the<br/>
        best results.
      </div>
      <div class="arrow-label label-br">
        Stay<br/>
        the longest.
      </div>

    </div>

    <!-- Signature wordmark bottom-right -->
    <div class="signature">
      Soulmate Studio
      <svg class="scribble" viewBox="0 0 140 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 5 C 25 2, 50 7, 75 3 S 125 6, 137 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>

  </div>
</body>
</html>
